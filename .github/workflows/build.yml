name: Build SwiftGramSaver
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos and Toolchain
        # 使用专门的 action 自动配置 Theos、工具链和 SDK
        uses: kabiroberai/setup-theos-action@v1

      - name: Build Dylib
        run: |
          # 编译插件
          make package FINALPACKAGE=1
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftGramSaver-Dylib
          path: .obj/*.dylib
