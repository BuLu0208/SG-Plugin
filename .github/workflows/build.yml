name: Build SwiftGramSaver
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl git perl make build-essential xz-utils
          export THEOS=/opt/theos
          sudo rm -rf $THEOS
          sudo git clone --recursive https://github.com/theos/theos.git $THEOS
          
      - name: Setup Toolchain
        run: |
          export THEOS=/opt/theos
          sudo mkdir -p $THEOS/toolchain
          # 下载适用于 Ubuntu (x86_64) 的 iOS 交叉编译工具链
          curl -LO https://github.com/sirus2001/theos-toolchain/releases/download/v1.1/toolchain-linux-x86_64.tar.xz
          sudo tar -xvf toolchain-linux-x86_64.tar.xz -C $THEOS/toolchain
          # 确保路径匹配 Theos 的默认搜索路径
          sudo mv $THEOS/toolchain/linux $THEOS/toolchain/iphone || true
          rm toolchain-linux-x86_64.tar.xz

      - name: Setup SDK
        run: |
          export THEOS=/opt/theos
          sudo rm -rf $THEOS/sdks
          sudo git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
          sudo chmod -R 777 $THEOS

      - name: Build Dylib
        run: |
          export THEOS=/opt/theos
          # 强制指定架构和生成
          make package FINALPACKAGE=1
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftGramSaver-Dylib
          path: .obj/*.dylib
