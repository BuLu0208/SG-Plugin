name: Build SwiftGramSaver

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    
    - name: Install dependencies
      run: |
        brew install ldid
    
    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git theos
        curl -LO https://github.com/theos/sdks/archive/master.zip
        unzip master.zip
        mkdir -p theos/sdks
        mv sdks-master/* theos/sdks/
        rm -rf sdks-master master.zip
        
    - name: Build project
      env:
        THEOS: ${{ github.workspace }}/theos
      run: |
        export PATH=$THEOS/bin:$PATH
        # 使用 all 代替 package，避免因缺少 control 文件报错
        make all FINALPACKAGE=1 ARCHS="arm64 arm64e"
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SwiftGramSaver-Dylib
        # 精确指定编译出的成品路径
        path: .theos/obj/SwiftGramSaver.dylib
