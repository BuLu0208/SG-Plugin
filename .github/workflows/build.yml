name: Build SwiftGramSaver
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl git perl make build-essential xz-utils
          export THEOS=/opt/theos
          sudo rm -rf $THEOS
          sudo git clone --recursive https://github.com/theos/theos.git $THEOS
          
      - name: Setup Toolchain
        run: |
          export THEOS=/opt/theos
          sudo mkdir -p $THEOS/toolchain/linux/iphone
          # 使用 Diatrus 维护的可靠工具链源
          curl -LO https://github.com/Diatrus/Action-Theos/raw/master/toolchain.tar.xz
          sudo tar -xvf toolchain.tar.xz -C $THEOS/toolchain
          # 整理路径
          sudo mv $THEOS/toolchain/linux/iphone $THEOS/toolchain/temp_iphone || true
          sudo rm -rf $THEOS/toolchain/linux
          sudo mkdir -p $THEOS/toolchain/linux
          sudo mv $THEOS/toolchain/temp_iphone $THEOS/toolchain/linux/iphone || true
          rm toolchain.tar.xz

      - name: Setup SDK
        run: |
          export THEOS=/opt/theos
          sudo rm -rf $THEOS/sdks
          # 下载专为 Theos 优化的精简版 SDK
          sudo git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
          sudo chmod -R 777 $THEOS

      - name: Build Dylib
        run: |
          export THEOS=/opt/theos
          # 显式指定编译器路径，防止 make 走丢
          export PATH=$THEOS/toolchain/linux/iphone/bin:$PATH
          make package FINALPACKAGE=1
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftGramSaver-Dylib
          path: .obj/*.dylib
