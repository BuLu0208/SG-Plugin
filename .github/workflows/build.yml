name: Build SwiftGramSaver
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl git perl make build-essential
          export THEOS=/opt/theos
          # 如果目录已存在则先删除，确保干净安装
          sudo rm -rf $THEOS
          sudo git clone --recursive https://github.com/theos/theos.git $THEOS
          sudo chmod -R 777 $THEOS
          
      - name: Setup SDK
        run: |
          export THEOS=/opt/theos
          # 核心修复：强制删除已存在的 sdks 文件夹再克隆
          sudo rm -rf $THEOS/sdks
          sudo git clone https://github.com/theos/sdks.git $THEOS/sdks
          sudo chmod -R 777 $THEOS/sdks

      - name: Build Dylib
        run: |
          export THEOS=/opt/theos
          make package FINALPACKAGE=1
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftGramSaver-Dylib
          path: .obj/*.dylib
